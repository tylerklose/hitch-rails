schema_version: 1
ideas:
  - id: modern_request_envelope_and_headers
    classification: standards_required
    sources: []
    disposition: adopted
    rationale: MCP 2026-07-28 requires the modern metadata envelope and standard headers.
  - id: sdk_dispatch_and_schema_validation
    classification: standards_required
    sources: []
    disposition: adopted
    rationale: The official SDK remains authoritative for dispatch and schema validation.
  - id: dedicated_mcp_endpoint
    classification: independently_converged
    sources: [skillit, stash]
    disposition: adopted
    rationale: Both independent roots isolate MCP HTTP handling from ordinary controllers.
  - id: fresh_server_and_context_per_request
    classification: independently_converged
    sources: [skillit, stash]
    disposition: adopted
    rationale: Both roots construct request-local server/context state.
  - id: explicit_tool_allowlist
    classification: independently_converged
    sources: [skillit, stash]
    disposition: adopted
    rationale: Both roots enumerate tools instead of discovering constants automatically.
  - id: principal_filter_before_server_construction
    classification: independently_converged
    sources: [skillit, stash]
    disposition: adopted
    rationale: Both roots filter the SDK tool set using request authority.
  - id: base_toolcall_scope_perform_chain
    classification: copied_lineage
    sources: [skillit, kaffe_karma, perfect_roofing]
    disposition: adapted
    rationale: Useful policy layering survived two descendants but remains one design lineage.
  - id: persistent_mcp_audit_table
    classification: copied_lineage
    sources: [skillit, kaffe_karma, perfect_roofing]
    disposition: rejected
    rationale: Hitch emits structural events while hosts own semantic durable audit.
  - id: shared_argument_scrubber
    classification: copied_lineage
    sources: [skillit, kaffe_karma, perfect_roofing]
    disposition: rejected
    rationale: Hitch prevents sensitive structural emission instead of scrubbing arbitrary payloads later.
  - id: sdk_compatible_tool_name_subset
    classification: host_policy
    sources: []
    disposition: adopted
    rationale: The release chooses a documented portable subset while the pinned SDK differs from SEP-986.
  - id: authenticated_endpoint_fixed_window_limit
    classification: host_policy
    sources: []
    disposition: adopted
    rationale: The profile requires one bounded fleet-shared request admission policy.
  - id: public_policy_adapter_registry
    classification: rejected
    sources: []
    disposition: rejected
    rationale: No repeated independent evidence supports another adapter abstraction.
  - id: bundled_pundit_integration
    classification: rejected
    sources: []
    disposition: rejected
    rationale: Hosts express record policy inside the two ordinary Ruby gates.
  - id: distributed_concurrency_leases
    classification: rejected
    sources: []
    disposition: deferred
    rationale: The 0.2 profile promises request rate limits, not host capacity leases.
