schema_version: 1
owner_issue: M8
required_domains:
  - endpoint_gate
  - endpoint_redaction
  - tool_redaction
  - observation_correlation
  - json_copy
subjects:
  - domain: endpoint_gate
    expression: Hitch::MCP::Endpoint#hitch_mcp_gate!
  - domain: endpoint_redaction
    expression: Hitch::MCP::Internal::EndpointErrorReporter.reporting_context
  - domain: tool_redaction
    expression: Hitch::MCP::Internal::ErrorNormalizer.reporting_context
  - domain: observation_correlation
    expression: Hitch::MCP::Internal::Observation.correlation_id
  - domain: json_copy
    expression: Hitch::MCP::Internal::JsonValues::Copier
