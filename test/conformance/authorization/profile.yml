official_profile:
  scenario: authorization-server-metadata-endpoint
  mutation: none
  evidence_class: official_unmodified_authorization_metadata
reviewed_extension:
  scenario: authorization-code-grant
  rationale: >-
    The pinned upstream authorization-server runner does not forward the MCP
    resource indicator and chooses public authentication whenever metadata also
    advertises none. The reviewed patch forwards one identical resource at the
    authorization and token endpoints and selects an advertised confidential
    method when a secret is supplied. It changes no upstream conformance check.
  patch: test/conformance/authorization/resource-aware-grants.patch
  patch_sha256: 35403574632cf54ca6b133abfa5d52c91499972f17d55904890853ca130d2597
  fixtures:
    - public
    - confidential_client_secret_basic
  evidence_class: reviewed_resource_indicator_extension
local_bridge:
  tests:
    - test/conformance/authorization/metadata_profile_test.rb
    - test/conformance/authorization/resource_aware_grants_test.rb
  evidence_class: local_regression_only
evidence_retention:
  credential_bearing_raw_output: ephemeral_never_uploaded
  ci_artifact: sanitized_summary_and_raw_file_hashes
  rails_log: disposable_mode_0600_with_credential_canaries
profiles:
  metadata:
    command: bin/conformance-auth --profile metadata
  resource-aware-grants:
    command: bin/conformance-auth --profile resource-aware-grants
