schema_version: 1
protocol_version: "2026-07-28"
notes:
  - Boundary failures before a trusted JSON-RPC id use null id; Host, Origin, method, authentication, and admission failures do not parse or return a protocol body.
  - Single-valued MCP headers reject duplicate/comma-combined values after OWS trimming. Accept is the only list-valued profile header.
  - The duplicate-member parser rejects a repeated member in any JSON object so security decisions never depend on last-value semantics.
