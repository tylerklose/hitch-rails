name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  supported-matrix:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.rails }} / ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.3"
            rails: "7.2"
            adapter: sqlite3
            profile: rails_7_2_sqlite
            gemfile: gemfiles/rails_7_2_sqlite.gemfile
            database_url: sqlite3:/tmp/hitch_matrix.sqlite3
          - ruby: "4.0"
            rails: "8.1"
            adapter: postgresql
            profile: rails_8_1_postgresql
            gemfile: gemfiles/rails_8_1_postgresql.gemfile
            database_url: postgresql://postgres:postgres@127.0.0.1:5432/hitch_matrix_test

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
      DATABASE_URL: ${{ matrix.database_url }}
      HITCH_FAIL_ON_SKIPS: "1"
      RAILS_ENV: test
      SCHEMA: ${{ runner.temp }}/${{ matrix.profile }}_schema.rb

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Create and migrate disposable database
        run: bin/ci-appraisal ${{ matrix.profile }} -- bin/rails db:create db:migrate

      - name: Verify eager loading
        run: bin/ci-appraisal ${{ matrix.profile }} -- bundle exec rake app:zeitwerk:check

      - name: Run supported-lane suite
        run: bin/ci-appraisal ${{ matrix.profile }} -- bin/rails test

      - name: Run style gate
        run: bin/rubocop

      - name: Verify work-packet graph
        run: bin/verify-work-packets

  sdk-lanes:
    name: MCP SDK ${{ matrix.lane }} compatibility lane
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: min
            gemfile: gemfiles/mcp_min.gemfile
          - lane: latest
            gemfile: gemfiles/mcp_latest.gemfile

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run SDK boundary contracts
        run: bin/ci-sdk ${{ matrix.lane }}

      - name: Run authenticated wire contracts
        run: bin/ci-wire ${{ matrix.lane }}

  checkpoint-gates:
    name: Aggregate checkpoint and package gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [supported-matrix, sdk-lanes]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      HITCH_APPRAISAL_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      HITCH_MIGRATIONS_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      HITCH_PACKAGE_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      HITCH_PACKAGE_REPORT: ${{ runner.temp }}/package-smoke.json
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby 4.0
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Set up pinned authorization conformance Node
        uses: actions/setup-node@v6
        with:
          node-version: "23.7.0"
          package-manager-cache: false

      - name: Set up pinned authorization conformance npm
        run: npm install --global npm@11.1.0

      - name: Install Rails 7.2 appraisal
        env:
          BUNDLE_GEMFILE: gemfiles/rails_7_2_sqlite.gemfile
        run: bundle install

      - name: Install Rails 8.1 appraisal
        env:
          BUNDLE_GEMFILE: gemfiles/rails_8_1_postgresql.gemfile
        run: bundle install

      - name: Install minimum MCP SDK lane
        env:
          BUNDLE_GEMFILE: gemfiles/mcp_min.gemfile
        run: bundle install

      - name: Install latest-compatible MCP SDK lane
        env:
          BUNDLE_GEMFILE: gemfiles/mcp_latest.gemfile
        run: bundle install

      - name: Run official authorization metadata profile
        env:
          HITCH_CONFORMANCE_EVIDENCE_DIR: ${{ runner.temp }}/auth-conformance/metadata
        run: bin/conformance-auth --profile metadata

      - name: Run reviewed resource-aware authorization grants
        env:
          HITCH_CONFORMANCE_EVIDENCE_DIR: ${{ runner.temp }}/auth-conformance/resource-aware-grants
        run: bin/conformance-auth --profile resource-aware-grants

      - name: Run aggregate CI
        run: bin/ci

      - name: Upload internal checkpoint evidence
        uses: actions/upload-artifact@v7
        with:
          name: hitch-rails-internal-development-evidence
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/package-smoke.json

      - name: Upload sanitized authorization conformance evidence
        uses: actions/upload-artifact@v7
        with:
          name: hitch-authorization-conformance-sanitized
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/auth-conformance
